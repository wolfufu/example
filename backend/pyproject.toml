[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ApsilonXi", email = "volkov.volkova2000@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "redis>=8.1.0",
    "geopandas>=1.2.0",
    "shapely>=2.2.0",
    "pyproj>=3.8.0",
    "geoalchemy2>=0.20.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
